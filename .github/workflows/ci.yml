name: CI - MyLibrary

on:
  push:
    branches: [master, develop, "feature/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [master, develop]

jobs:
  build-backend:
    name: Build Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-end/Biblioteca/Biblioteca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build e testes
        run: mvn -B verify --no-transfer-progress

  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-end/Sistema-Biblioteca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Front-end/Sistema-Biblioteca/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Build de produção
        run: npm run build
